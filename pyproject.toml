[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "smairt"
version = "0.4.0"
description = "Create readable SMAIRT research workspaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PNNL Computational Biology" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "Jinja2>=3.1",
  "pydantic>=2.0",
  "platformdirs>=4.0",
  "prompt_toolkit>=3.0.52,<4",
  "PyYAML>=6.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.0",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[project.scripts]
smairt = "smairt.cli:main"

[tool.hatch.build]
# macOS writes .DS_Store into any browsed directory, including `src/smairt/assets/scaffold`.
# Those files are gitignored, so they never appear in a review, but the build copies whatever
# is on disk — so a wheel built on a Mac would ship them into every generated project.
exclude = ["**/.DS_Store"]

[tool.hatch.build.targets.wheel]
packages = ["src/smairt"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/smairt",
  "/tests",
  "/scripts/smoke_install.py",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
files = ["src", "tests"]
exclude = ["tests/fixtures/golden/"]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

# Scaffold helpers import `scripts.shared.*`, which resolves only inside a generated
# project, where the helper puts the project root on the path. The import is exercised
# for real by the end-to-end CLI tests; here only its absence is unresolvable, so the
# helpers stay type-checked without the import being reported.
[[tool.mypy.overrides]]
module = "scripts.*"
ignore_missing_imports = true
